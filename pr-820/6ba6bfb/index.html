<main><h1>#820 界面预览</h1><p class="m">commit 6ba6bfb · <a href="https://github.com/yetone/magpie/pull/820">回到 PR</a> · 为有未保存修改的供应商/路由/资源库编辑器加上应用内样式的「放弃修改」确认框，并在移除供应商、账号或密钥、路由组、插件、资源库条目时先弹出「移除」确认框（带遮罩、危险色按钮、焦点陷阱），未改动的编辑器仍可直接关闭。另外给导航加 aria-current、给对话框加 role/aria-modal 与背景 inert、把标签与说明关联到控件，并在首屏绘制前应用模式/平台类、主题与字号。</p>
